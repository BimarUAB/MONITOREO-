<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e6fb8" />
  <title>Seguimiento Académico — UE Jesús María Fe y Alegría</title>
  <meta name="description" content="Módulo de Seguimiento Académico de la Unidad Educativa Jesús María Fe y Alegría, El Alto — La Paz, Bolivia." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="img/logo.png" />
</head>
<body>
  <!-- Encabezado (oculto en login) -->
  <header id="app-header" class="app-header" hidden>
    <div class="header-inner">
      <a href="#" class="brand" id="brand-link">
        <span class="brand-logo" aria-hidden="true"><img src="img/logo.png" alt="" /></span>
        <span class="brand-text">
          <strong>Fe y Alegría</strong>
          <small>Seguimiento Académico</small>
        </span>
      </a>
      <div class="header-actions">
        <button id="btn-notif" class="icon-btn" aria-label="Notificaciones" title="Notificaciones">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span id="notif-badge" class="badge" hidden>0</span>
        </button>
        <div class="user-chip" id="user-chip"></div>
        <button id="btn-logout" class="btn btn-ghost btn-sm" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="logout-text">Salir</span>
        </button>
      </div>
    </div>
    <!-- Panel de notificaciones -->
    <div id="notif-panel" class="notif-panel" hidden></div>
  </header>

  <!-- Contenedor principal de la SPA -->
  <main id="view" class="view" aria-live="polite"></main>

  <!-- Barra de navegación inferior / pestañas del rol activo -->
  <nav id="tabbar" class="tabbar" hidden></nav>

  <!-- Contenedores globales -->
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/app.js?v=20260916-course-status"></script>
</body>
</html>
